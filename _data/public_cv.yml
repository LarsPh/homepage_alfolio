          - 幾何情報を用いてNeRFの描画を高速化する論文「<a href="https://arxiv.org/abs/2311.10091">Adaptive Shells</a>」を、学習から高速レンダラーまで再現実装しました。OptiXによる交差判定とDr.JitによるGPU処理の融合を組み合わせ、実測に基づいて高速化しました。勾配の大きさを含むベクトル予測も導入し、微分計算の負担を減らしました。
