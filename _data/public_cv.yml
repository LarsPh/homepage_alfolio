  - title: Independent Projects
    entries:
      - title: <a href="https://github.com/LarsPh/open-adaptive-shells">Open Adaptive Shells</a>
        date: ""
        paragraphs:
          - Reimplemented <a href="https://arxiv.org/abs/2311.10091">Adaptive Shells</a>, a geometry-guided method for accelerating
            NeRF rendering, from training through a high-speed renderer. Combined OptiX intersection queries with GPU kernel fusion
            in Dr.Jit and optimized performance based on measurements. Also introduced prediction of gradient vectors including
            their magnitudes to reduce differentiation costs.
          - <a href="https://github.com/LarsPh/open-adaptive-shells">Code</a>
