  - title: Research Experience
    entries:
      - title: '<a href="https://larsph.github.io/avatarmix/">AvatarMix: High-Quality 3D Virtual Try-On</a>'
        date: Doctoral research
        paragraphs:
          - <strong>Overview.</strong> Developed a high-quality 3D virtual try-on method that combines two 3D avatars to show one
            person wearing the other's clothing while preserving the wearer's face and body shape.
          - <strong>Method.</strong> Proposed a method that combines the wearer's head with the clothing donor's avatar and adapts
            the entire body to the wearer's shape. Used a diffusion model to repair composition seams and appearance artifacts caused
            by deformation.
          - <strong>Contribution.</strong> Formulated the body adaptation and seam repair problems and led method development, implementation,
            evaluation, visualization, and manuscript preparation.
          - <strong>Publication.</strong> Accepted to CVPR 2026 Findings.
          - <a href="https://openaccess.thecvf.com/content/CVPR2026F/html/Wang_AvatarMix_Identity-Preserving_Cross-Avatar_Composition_for_Outfit_Personalization_CVPRF_2026_paper.html">Paper</a>  <a
            href="https://larsph.github.io/avatarmix/">Project page</a>  <a href="https://github.com/LarsPh/AvatarMix-Code">Code</a>
      - title: '<a href="https://doi.org/10.26599/CVM.2025.9450508">EG-HumanNeRF: Fast Human Novel-View Synthesis</a>'
        date: Master's research
        paragraphs:
          - <strong>Overview.</strong> Developed a feed-forward method that synthesizes novel views of a person from three or four
            images, balancing rendering speed and image quality without per-person retraining.
          - <strong>Method.</strong> Used the SMPL-X human body model and predicted geometry to narrow NeRF sampling regions in
            two stages, reducing computation. Improved image quality through occlusion-aware image refinement.
          - <strong>Contribution.</strong> Developed the two-stage sampling method and occlusion-aware refinement, accelerated the
            overall pipeline, and led implementation, evaluation, and manuscript preparation.
          - <strong>Publication.</strong> Published in Computational Visual Media, 12(2), 355–379 (2026).
          - <a href="https://doi.org/10.26599/CVM.2025.9450508">Paper</a>  <a href="https://ieeexplore.ieee.org/document/11373444/">Publisher</a>  <a
            href="https://github.com/LarsPh/EG-HumanNeRF">Code</a>
