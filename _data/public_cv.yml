  - title: 研究経験
    entries:
      - title: <a href="https://larsph.github.io/avatarmix/">AvatarMix：3Dアバターを用いた高品質な仮想試着</a>
        date: 博士課程
        paragraphs:
          - <strong>概要</strong>　二つの3Dアバターから、一方の人物の顔や体型を保ちながら、もう一方の服装を着用した姿を作る、高品質な3D仮想試着手法を研究しました。
          - <strong>手法</strong>　試着する人物の頭部を衣服提供側のアバターに組み合わせ、身体全体を本人の体型に合わせる新しい仮想試着手法を提案し、合成部の継ぎ目や変形による外観の崩れを拡散モデルで修復しました。
          - <strong>自身の貢献</strong>　体型適応と接合部修復の課題を具体化し、手法構築から実装、評価、可視化、論文執筆まで主導しました。
          - <strong>論文採択歴</strong>　CVPR 2026 Findingsに採択。
          - <a href="https://openaccess.thecvf.com/content/CVPR2026F/html/Wang_AvatarMix_Identity-Preserving_Cross-Avatar_Composition_for_Outfit_Personalization_CVPRF_2026_paper.html">論文</a>  <a
            href="https://larsph.github.io/avatarmix/">プロジェクトページ</a>  <a href="https://github.com/LarsPh/AvatarMix-Code">公開コード</a>
      - title: <a href="https://doi.org/10.26599/CVM.2025.9450508">EG-HumanNeRF：少数画像からの高速な人物新視点合成</a>
        date: 修士課程
        paragraphs:
          - <strong>概要</strong>　同一人物を撮影した三、四枚の画像から、未撮影の視点の人物画像を生成するフィードフォワード型の手法を研究しました。人物ごとの再学習を必要とせず、描画速度と画質の両立を図ります。
          - <strong>手法</strong>　人体モデル（SMPL-X）と予測した幾何情報を用いてNeRFのサンプリング範囲を二段階で絞り、計算量を減らすとともに、遮蔽領域を考慮した画像補正で画質を改善しました。
          - <strong>自身の貢献</strong>　二段階のサンプリング手法と遮蔽を考慮した画像補正を設計し、処理全体の高速化、実装、評価、論文執筆まで主導しました。
          - <strong>論文採択歴</strong>　Computational Visual Media 12(2), 355–379（2026）に掲載。
          - <a href="https://doi.org/10.26599/CVM.2025.9450508">論文</a>  <a href="https://ieeexplore.ieee.org/document/11373444/">掲載先</a>  <a
            href="https://github.com/LarsPh/EG-HumanNeRF">公開コード</a>
  - title: 現在の研究
