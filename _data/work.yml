- id: avatarmix
  kind: research
  title: "AvatarMix: Identity-Preserving Cross-Avatar Composition for Outfit Personalization"
  venue: CVPR 2026 Findings
  image: /assets/img/publication_preview/avatarmix.jpg
  alt: AvatarMix combines clothing from one avatar with the identity and body shape of another.
  url: https://larsph.github.io/avatarmix/
  description:
    en: 3D virtual try-on that combines two avatars while preserving the wearer's face and body shape, with diffusion-based repair of seams and appearance artifacts.
    ja: 二つのアバターを組み合わせ、着用者の顔と体型を保つ3D仮想試着。拡散モデルで継ぎ目や外観の崩れを修復します。
  links:
    - label: Paper
      url: https://openaccess.thecvf.com/content/CVPR2026F/html/Wang_AvatarMix_Identity-Preserving_Cross-Avatar_Composition_for_Outfit_Personalization_CVPRF_2026_paper.html
    - label: Code
      url: https://github.com/LarsPh/AvatarMix-Code
    - label: Project
      url: https://larsph.github.io/avatarmix/
    - label: arXiv
      url: https://arxiv.org/abs/2606.03506
- id: eg-humannerf
  kind: research
  title: "EG-HumanNeRF: Efficient Generalizable Human NeRF Utilizing Human Prior for Sparse View"
  venue: Computational Visual Media, 12(2), 355–379, 2026
  image: /assets/img/publication_preview/eg-humannerf.gif
  alt: Interactive novel-view rendering of a reconstructed person in EG-HumanNeRF.
  url: https://doi.org/10.26599/CVM.2025.9450508
  description:
    en: Novel human views from three or four images, using a body prior and predicted geometry to reduce sampling, followed by occlusion-aware image refinement.
    ja: 三、四枚の画像から人物の新視点画像を生成。人体モデルと予測した幾何情報でサンプリングを減らし、遮蔽を考慮した画像補正を行います。
  links:
    - label: Paper
      url: https://doi.org/10.26599/CVM.2025.9450508
    - label: Code
      url: https://github.com/LarsPh/EG-HumanNeRF
    - label: Video
      url: https://github.com/LarsPh/EG-HumanNeRF/blob/main/docs/assets/gui-demo.mp4
    - label: arXiv
      url: https://arxiv.org/abs/2410.12242
